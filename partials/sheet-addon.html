<!-- ============================================================ -->
<!-- ===== SHEET: ADDON PRODUK (Widget Jam) ===== -->
<div class="sheet-overlay" id="addonSheetOverlay"></div>
<div class="payment-method-sheet" id="addonSheet">
    <div class="sheet-handle"></div>
    <div id="addonSheetView">
        <div class="sheet-title">Siapa Tau Kamu Berminat 👀</div>
        <div class="addon-card" id="addonCard">
            <img class="addon-card-img" id="addonCardImg" src="" alt="Addon" />
            <div class="addon-card-info">
                <div class="addon-card-name" id="addonCardName"></div>
                <div class="addon-card-desc" id="addonCardDesc"></div>
                <div class="addon-card-price" id="addonCardPrice"></div>
            </div>
            <div class="addon-check" id="addonCheck">
                <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg>
            </div>
        </div>
        <div class="addon-total-box">
            <span class="addon-total-label">Total</span>
            <span class="addon-total-value" id="addonTotalValue">Rp 500</span>
        </div>
        <button class="btn-lanjutkan" id="btnLanjutkanAddon">Lanjutkan • Rp 500</button>
    </div>
    <div class="sheet-loading-view" id="addonLoadingView">
        <div class="loading-ring"></div>
        <p class="loading-label">Menyiapkan Metode Pembayaran...</p>
        <div class="loading-progress-track">
            <div class="loading-progress-fill" id="addonProgressFill"></div>
        </div>
    </div>
</div>
