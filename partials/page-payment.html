<!-- ===== HALAMAN PEMBAYARAN (QRIS) ===== -->
<div class="page-payment" id="pagePayment">
    <!-- Tombol back dengan animasi -->
    <div class="payment-top-bar">
        <div class="btn-back-payment" id="btnBackPayment">‹</div>
        <div class="btn-notif-payment" id="btnNotifPayment" onclick="openNotifPage()">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            <span class="notif-count-badge" id="notifCountPayment"></span>
            <div class="notif-overlay-preview notif-overlay-preview-left" id="notifOverlayPreviewPayment" onclick="event.stopPropagation(); openNotifPage();">
                <div class="notif-overlay-latest"></div>
                <div class="notif-overlay-text"></div>
            </div>
        </div>
    </div>

    <div class="payment-title">💳 Pembayaran</div>

    <img class="payment-qris-img" id="paymentQrisImg" src="" alt="QRIS" />

    <div class="qris-price-box">
        <div class="qris-price-col">
            <span class="qris-price-text" id="qrisPriceText">Rp 0</span>
            <span class="qris-admin-text" id="qrisAdminText">+ biaya admin</span>
        </div>
        <a href="#" download="QRIS-DixzVip.jpg" id="btnDownloadQris" class="btn-download-qris">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 4h2v7h3l-4 4-4-4h3V4zM5 18h14v2H5z"/></svg>
            DOWNLOAD
        </a>
    </div>

    <div class="payment-info">
        <li><span class="step-num">1</span> Pembayaran via <strong>QRIS</strong></li>
        <li><span class="step-num">2</span> Scan QRIS di atas</li>
        <li><span class="step-num">3</span> Kirim bukti transaksi ke WA</li>
        <li><span class="step-num">4</span> <span id="paymentInstr4">Produk dikirim lewat WA</span></li>
    </div>

    <!-- Kotak hijau soft horizontal -->
    <a href="#" id="btnBuktiWa" target="_blank" class="btn-bukti-wa">
        Kirim Bukti Transaksi Ke Sini
    </a>

    <p style="text-align:center;margin-top:20px;font-weight:600;color:#555;">Mimin insyaallah fast respon yah 🥰</p>
</div>
