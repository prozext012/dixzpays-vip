    <!-- Schema markup: bantu Google mengenali brand "Andika Store" / "dixz-vip" / "Andika" sebagai entitas yang sama -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Andika Store",
        "alternateName": ["dixz-vip", "dixz", "Andika"],
        "url": "https://dixz-vip.vercel.app",
        "description": "Toko online yang dibuat dan dikelola oleh Andika. Jual followers Instagram & TikTok murah, APK widget jam estetik, dan bundle 2000+ ebook digital premium.",
        "founder": {
            "@type": "Person",
            "name": "Andika"
        },
        "makesOffer": [
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Followers Instagram" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Followers TikTok" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "APK Widget Jam" } },
            { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "2.000+ Buku Digital Premium" } }
        ]
    }
    </script>
